name: scrape
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Puzzle date to process (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        type: string
  schedule:
    - cron: '0 12 * * *'
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Pick the puzzle date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |-
          if [ -z "$INPUT_DATE" ]; then
            PUZZLE_DATE=$(date -I -d '-1 day')
          elif [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$INPUT_DATE" >/dev/null 2>&1; then
            PUZZLE_DATE="$INPUT_DATE"
          else
            echo "::error::Invalid date '$INPUT_DATE', expected YYYY-MM-DD"
            exit 1
          fi
          echo "Processing puzzle date $PUZZLE_DATE"
          echo "PUZZLE_DATE=$PUZZLE_DATE" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Install a specific version of uv.
          version: "0.8.4"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Scrape the comments
        run: uv run src/scrape.py -d "$PUZZLE_DATE"

      - name: Analyze the comments
        run: uv run src/analyze.py -d "$PUZZLE_DATE"

      - name: Upload the comments
        run: uv run src/upload.py -d "$PUZZLE_DATE"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit and push if content changed
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp} (puzzle ${PUZZLE_DATE})" || exit 0
          # Other runs (e.g. backfills) may have pushed since checkout; rebase and retry.
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
